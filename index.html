<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Website Proxy</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <p class="eyebrow">Allow-all proxy</p>
        <h1>Browser Website Proxy</h1>
      </header>

      <main class="layout">
        <div class="toolbar">
          <input id="urlInput" type="text" value="https://example.com" placeholder="https://example.com" />
          <button id="loadButton">Load Site</button>
        </div>

        <div class="controls">
          <button id="backButton" type="button" class="secondary">Back</button>
          <button id="forwardButton" type="button" class="secondary">Forward</button>
          <button id="refreshButton" type="button" class="secondary">Refresh</button>
          <button id="clearButton" type="button" class="secondary danger">Clear</button>
        </div>

        <div id="status" class="status">Ready</div>

        <div class="browser-shell">
          <iframe id="previewFrame" title="Proxied website preview" srcdoc="<html><body style='font-family:sans-serif;padding:24px;color:#222'>Loading...</body></html>"></iframe>
        </div>
      </main>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
